name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` lets GitHub mint the OIDC token that npm's Trusted
    # Publisher check verifies against the publisher registered on the package
    # (repo diegoscarabelli/system2, workflow release.yml, action npm publish).
    # `contents: read` stays for actions/checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC-to-registry token exchange) requires
      # npm CLI >= 11.5.1. Node 22 ships with npm 10.x and Node 24's runner
      # image currently has npm 11.4, so we install the latest npm explicitly
      # to guarantee the exchange path is available. This is why the first
      # v0.6.2 attempt failed: npm 11.4 emitted a signed provenance but then
      # PUT to the registry without an auth token and got the E404
      # (permission-denied-as-not-found) that npm returns for anon PUTs.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check

      - run: pnpm test

      # Use the top-level npm CLI (not `pnpm publish`) for the publish itself:
      # only npm >= 11.5.1 knows to exchange the GitHub OIDC token for a
      # short-lived npm registry token before the PUT. `--provenance`
      # additionally signs a SLSA-style attestation and posts it to the
      # sigstore transparency log so npmjs.com renders a "verified" badge.
      # Requires `id-token: write` above and Trusted Publishing configured
      # on the package (npm settings → Publishing access). No NODE_AUTH_TOKEN
      # needed — the OIDC exchange is the credential.
      - run: npm publish --provenance --access public
