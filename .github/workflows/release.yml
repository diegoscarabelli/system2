name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` lets GitHub mint the OIDC token that npm's Trusted
    # Publisher check verifies against the publisher registered on the package
    # (repo diegoscarabelli/system2, workflow release.yml, action npm publish).
    # `contents: read` stays for actions/checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check

      - run: pnpm test

      # `--provenance` publishes a signed SLSA-style attestation linking the
      # npm tarball to this exact repo + commit + workflow run. Requires the
      # `id-token: write` permission above and npm Trusted Publishing to be
      # configured on the package (npm settings → Publishing access). No
      # NODE_AUTH_TOKEN needed: the OIDC token is the credential.
      - run: pnpm publish --no-git-checks --provenance
